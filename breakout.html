<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打砖块 — 明园山工作室</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--text:#e2e8f0;--sub:#94a3b8;--accent:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC",sans-serif;min-height:100vh;padding:18px 16px 40px;display:flex;flex-direction:column;align-items:center}
.topbar{width:100%;max-width:640px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:13px}
.topbar a{color:var(--sub);text-decoration:none;border:1px solid var(--line);padding:7px 13px;border-radius:4px}
.topbar a:hover{color:var(--accent);border-color:var(--accent)}
.topbar span{color:#64748b;letter-spacing:.1em}
.hud{width:100%;max-width:640px;display:flex;justify-content:space-between;margin-bottom:12px;font-size:14px}
.hud b{color:var(--accent);font-variant-numeric:tabular-nums}
canvas{border:2px solid var(--line);border-radius:6px;background:#0b1120;max-width:100%;touch-action:none}
.bar{width:100%;max-width:640px;display:flex;gap:10px;margin-top:14px}
.btn{flex:1;background:var(--accent);color:#052e16;border:0;border-radius:5px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.help{font-size:12px;color:var(--sub);margin-top:14px;text-align:center;line-height:1.9}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 7px;color:var(--text)}
</style>
</head>
<body>
<div class="topbar"><a href="mini-games.html">← 返回成熟小游戏</a><span>MINGYUANSHAN / BREAKOUT</span></div>
<div class="hud"><span>得分 <b id="score">0</b></span><span>关卡 <b id="level">1</b></span><span>生命 <b id="lives">3</b></span></div>
<canvas id="cv" width="640" height="520"></canvas>
<div class="bar"><button class="btn" id="startBtn">开始 / 暂停</button><button class="btn" id="newBtn" style="background:#334155;color:#e2e8f0">新游戏</button></div>
<div class="help"><kbd>←</kbd><kbd>→</kbd> 或移动鼠标控制挡板 · <kbd>空格</kbd> 发球 · 接住球别让它掉下去</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),livesEl=document.getElementById('lives');
const W=cv.width,H=cv.height;
let bricks=[],ball,paddle,score=0,level=1,lives=3,running=false,raf,keys={};
const COLORS=['#f87171','#fb923c','#facc15','#4ade80','#22d3ee','#818cf8'];
function buildLevel(){
  bricks=[];const cols=10,rows=5,bw=(W-40)/cols,bh=24;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({x:20+c*bw,y:50+r*(bh+6),w:bw-4,h:bh,alive:true,color:COLORS[r%COLORS.length]});
}
function resetBall(){ball={x:W/2,y:H-60,dx:0,dy:0,r:8,stuck:true};paddle={x:W/2-55,y:H-28,w:110,h:12}}
function init(){score=0;level=1;lives=3;buildLevel();resetBall();running=false;updateHud();draw();cancelAnimationFrame(raf)}
function launch(){if(ball.stuck){ball.dx=(Math.random()*.6-.3)+ (Math.random()<.5?-3:3);ball.dy=-4.5;ball.stuck=false;running=true;loop()}}
function updateHud(){scoreEl.textContent=score;levelEl.textContent=level;livesEl.textContent=lives}
function loop(){
  if(!running)return;
  update();draw();raf=requestAnimationFrame(loop);
}
function update(){
  if(keys.left)paddle.x-=7;if(keys.right)paddle.x+=7;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
  if(ball.stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-1;return}
  ball.x+=ball.dx;ball.y+=ball.dy;
  if(ball.x<ball.r){ball.x=ball.r;ball.dx*=-1}
  if(ball.x>W-ball.r){ball.x=W-ball.r;ball.dx*=-1}
  if(ball.y<ball.r){ball.y=ball.r;ball.dy*=-1}
  if(ball.y+ball.r>=paddle.y&&ball.y<paddle.y+paddle.h&&ball.dx!==0&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w&&ball.dy>0){
    ball.y=paddle.y-ball.r;
    const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
    ball.dx=hit*5;ball.dy=-Math.abs(ball.dy);
  }
  for(const b of bricks){
    if(!b.alive)continue;
    if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
      b.alive=false;ball.dy*=-1;score+=10;updateHud();break;
    }
  }
  if(bricks.every(b=>!b.alive)){
    level++;buildLevel();resetBall();running=false;updateHud();
  }
  if(ball.y>H+20){
    lives--;updateHud();
    if(lives<=0){running=false;ctx.fillStyle='rgba(11,17,32,.85)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#e2e8f0';ctx.font='bold 34px Inter';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H/2);ctx.font='16px Inter';ctx.fillText('得分 '+score+' · 点击新游戏重来',W/2,H/2+36)}
    else resetBall();
  }
}
function draw(){
  ctx.fillStyle='#0b1120';ctx.fillRect(0,0,W,H);
  for(const b of bricks){if(!b.alive)continue;ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h)}
  ctx.fillStyle='#22c55e';ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
  ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  if(ball.stuck&&running===false&&lives>0){ctx.fillStyle='rgba(226,232,240,.7)';ctx.font='15px Inter';ctx.textAlign='center';ctx.fillText('按空格发球',W/2,H/2)}
}
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){keys.left=true;e.preventDefault()}
  if(e.code==='ArrowRight'){keys.right=true;e.preventDefault()}
  if(e.code==='Space'){e.preventDefault();if(!running&&ball.stuck)launch()}
});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.left=false;if(e.code==='ArrowRight')keys.right=false});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();paddle.x=(e.clientX-r.left)/r.width*W-paddle.w/2;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x))});
cv.addEventListener('pointerdown',()=>{if(!running&&ball.stuck)launch()});
document.getElementById('startBtn').onclick=()=>{
  if(ball.stuck){launch()}
  else{running=!running;if(running)loop()}
};
document.getElementById('newBtn').onclick=()=>{cancelAnimationFrame(raf);init()};
init();
</script>
</body>
</html>
