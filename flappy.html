<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞行挑战 — 明园山工作室</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--text:#e2e8f0;--sub:#94a3b8;--accent:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC",sans-serif;min-height:100vh;padding:18px 16px 40px;display:flex;flex-direction:column;align-items:center}
.topbar{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:13px}
.topbar a{color:var(--sub);text-decoration:none;border:1px solid var(--line);padding:7px 13px;border-radius:4px}
.topbar a:hover{color:var(--accent);border-color:var(--accent)}
.topbar span{color:#64748b;letter-spacing:.1em}
.hud{width:100%;max-width:480px;display:flex;justify-content:space-between;margin-bottom:12px;font-size:14px}
.hud b{color:var(--accent);font-variant-numeric:tabular-nums}
canvas{border:2px solid var(--line);border-radius:6px;background:#0c1826;max-width:100%;touch-action:none}
.help{font-size:12px;color:var(--sub);margin-top:14px;text-align:center;line-height:1.9}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 7px;color:var(--text)}
</style>
</head>
<body>
<div class="topbar"><a href="mini-games.html">← 返回成熟小游戏</a><span>MINGYUANSHAN / FLIGHT</span></div>
<div class="hud"><span>得分 <b id="score">0</b></span><span>最高 <b id="best">0</b></span></div>
<canvas id="cv" width="480" height="640"></canvas>
<div class="help"><kbd>空格</kbd> / <kbd>↑</kbd> / 点击画面 拍动翅膀，穿过管道得分，撞到即结束。</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
function getBest(){try{return +(localStorage.getItem('mys_flappy_best')||0)||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem('mys_flappy_best',v)}catch(e){}}
let bird,pipes,score,state,best=getBest(),raf;
bestEl.textContent=best;
const GRAV=.42,FLAP=-7.4,GAP=170,PW=68;
function reset(){
  bird={x:140,y:H/2,vy:0,r:14};pipes=[];score=0;state='ready';scoreEl.textContent='0';
  cancelAnimationFrame(raf);draw();
}
function flap(){
  if(state==='over'){reset();return}
  if(state==='ready'){state='playing'}
  bird.vy=FLAP;
}
function addPipe(){
  const top=90+Math.random()*(H-GAP-180);
  pipes.push({x:W+20,top,gap:GAP,passed:false});
}
function update(){
  bird.vy+=GRAV;bird.y+=bird.vy;
  if(bird.y<bird.r){bird.y=bird.r;bird.vy=0}
  if(bird.y>H-bird.r){bird.y=H-bird.r;die();return}
  if(pipes.length===0||pipes[pipes.length-1].x<W-220)addPipe();
  for(const p of pipes){
    p.x-=3;
    if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+PW){
      if(bird.y-bird.r<p.top||bird.y+bird.r>p.top+p.gap){die();return}
    }
    if(!p.passed&&p.x+PW<bird.x){p.passed=true;score++;scoreEl.textContent=score;if(score>best){best=score;setBest(best)}bestEl.textContent=best}
  }
  pipes=pipes.filter(p=>p.x>-PW);
}
function die(){state='over';draw()}
function draw(){
  ctx.fillStyle='#0c1826';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(51,65,85,.4)';
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(const p of pipes){
    ctx.fillStyle='#22c55e';
    ctx.fillRect(p.x,0,PW,p.top);
    ctx.fillRect(p.x,p.top+p.gap,PW,H-p.top-p.gap);
    ctx.fillStyle='#16a34a';
    ctx.fillRect(p.x-3,p.top-14,PW+6,14);
    ctx.fillRect(p.x-3,p.top+p.gap,PW+6,14);
  }
  ctx.save();ctx.translate(bird.x,bird.y);
  ctx.rotate(Math.max(-.5,Math.min(1.2,bird.vy*.12)));
  ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fb923c';ctx.beginPath();ctx.moveTo(bird.r-2,0);ctx.lineTo(bird.r+10,4);ctx.lineTo(bird.r-2,8);ctx.fill();
  ctx.fillStyle='#111827';ctx.beginPath();ctx.arc(5,-4,2.2,0,Math.PI*2);ctx.fill();
  ctx.restore();
  if(state==='ready'){
    ctx.fillStyle='rgba(15,23,42,.7)';ctx.fillRect(0,H/2-70,W,140);
    ctx.fillStyle='#e2e8f0';ctx.font='bold 26px Inter';ctx.textAlign='center';ctx.fillText('点击 / 空格 开始',W/2,H/2-6);
    ctx.font='14px Inter';ctx.fillStyle='#94a3b8';ctx.fillText('拍动翅膀，穿过管道',W/2,H/2+24);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(15,23,42,.82)';ctx.fillRect(0,H/2-80,W,160);
    ctx.fillStyle='#f87171';ctx.font='bold 30px Inter';ctx.textAlign='center';ctx.fillText('游戏结束',W/2,H/2-16);
    ctx.fillStyle='#e2e8f0';ctx.font='16px Inter';ctx.fillText('得分 '+score+' · 最高 '+best,W/2,H/2+18);
    ctx.fillStyle='#94a3b8';ctx.font='13px Inter';ctx.fillText('点击 / 空格 再来一次',W/2,H/2+46);
  }
}
function loop(){if(state==='playing')update();draw();raf=requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
reset();loop();
</script>
</body>
</html>
