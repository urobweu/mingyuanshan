<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极速赛车 — 明园山工作室</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--text:#e2e8f0;--sub:#94a3b8;--accent:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC",sans-serif;min-height:100vh;padding:18px 16px 40px;display:flex;flex-direction:column;align-items:center}
.topbar{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:13px}
.topbar a{color:var(--sub);text-decoration:none;border:1px solid var(--line);padding:7px 13px;border-radius:4px}
.topbar a:hover{color:var(--accent);border-color:var(--accent)}
.topbar span{color:#64748b;letter-spacing:.1em}
.hud{width:100%;max-width:480px;display:flex;justify-content:space-between;margin-bottom:12px;font-size:14px}
.hud b{color:var(--accent);font-variant-numeric:tabular-nums}
canvas{border:2px solid var(--line);border-radius:6px;background:#111827;max-width:100%;touch-action:none}
.help{font-size:12px;color:var(--sub);margin-top:14px;text-align:center;line-height:1.9}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 7px;color:var(--text)}
</style>
</head>
<body>
<div class="topbar"><a href="mini-games.html">← 返回成熟小游戏</a><span>MINGYUANSHAN / RACER</span></div>
<div class="hud"><span>里程 <b id="score">0</b> m</span><span>最高 <b id="best">0</b> m</span></div>
<canvas id="cv" width="420" height="600"></canvas>
<div class="help"><kbd>←</kbd><kbd>→</kbd> 或移动鼠标控制赛车 · 躲避障碍，行驶越远分数越高 · <kbd>空格</kbd> 开始</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
function getBest(){try{return +(localStorage.getItem('mys_racer_best')||0)||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem('mys_racer_best',v)}catch(e){}}
let car,obstacles,score,dist,state,speed,best=getBest(),raf,keys={},tick;
bestEl.textContent=best;
function reset(){
  car={x:W/2-26,y:H-110,w:52,h:88};obstacles=[];score=0;dist=0;state='ready';speed=6;tick=0;
  scoreEl.textContent='0';cancelAnimationFrame(raf);draw();
}
function start(){if(state==='over'||state==='ready'){reset();state='playing';loop()}}
function spawn(){
  const w=40+Math.random()*70,x=Math.random()*(W-w-20)+10;
  obstacles.push({x,y:-60,w,h:40,color:Math.random()<.5?'#ef4444':'#f97316'});
}
function update(){
  tick++;
  if(keys.left)car.x-=8;if(keys.right)car.x+=8;
  car.x=Math.max(8,Math.min(W-car.w-8,car.x));
  dist+=speed/12;score=Math.floor(dist);scoreEl.textContent=score;
  speed=Math.min(14,6+score/120);
  if(tick%Math.max(18,50-Math.floor(score/100)*5)===0)spawn();
  for(const o of obstacles){
    o.y+=speed;
    if(car.x<o.x+o.w&&car.x+car.w>o.x&&car.y<o.y+o.h&&car.y+car.h>o.y){gameOver();return}
  }
  obstacles=obstacles.filter(o=>o.y<H+60);
  if(score>best){best=score;setBest(best)}
  bestEl.textContent=best;
}
function gameOver(){state='over';cancelAnimationFrame(raf);draw()}
function loop(){if(state!=='playing')return;update();draw();raf=requestAnimationFrame(loop)}
function drawRoad(){
  ctx.fillStyle='#0b1220';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1f2937';ctx.fillRect(30,0,W-60,H);
  ctx.strokeStyle='#4b5563';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(30,H);ctx.moveTo(W-30,0);ctx.lineTo(W-30,H);ctx.stroke();
  ctx.strokeStyle='#e5e7eb';ctx.lineWidth=3;ctx.setLineDash([22,22]);ctx.lineDashOffset=-(dist*4)%44;
  for(const lx of [W/2-45,W/2+45]){ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx,H);ctx.stroke()}
  ctx.setLineDash([]);
}
function draw(){
  drawRoad();
  for(const o of obstacles){ctx.fillStyle=o.color;ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(o.x+4,o.y+4,o.w-8,6)}
  ctx.fillStyle='#22c55e';ctx.fillRect(car.x,car.y,car.w,car.h);
  ctx.fillStyle='#166534';ctx.fillRect(car.x+4,car.y+12,car.w-8,26);
  ctx.fillStyle='#0f172a';ctx.fillRect(car.x+6,car.y+car.h-10,10,8);ctx.fillRect(car.x+car.w-16,car.y+car.h-10,10,8);
  if(state==='ready'){
    ctx.fillStyle='rgba(15,23,42,.72)';ctx.fillRect(0,H/2-70,W,140);
    ctx.fillStyle='#e2e8f0';ctx.font='bold 24px Inter';ctx.textAlign='center';ctx.fillText('空格 / 点击 开始',W/2,H/2-4);
    ctx.font='14px Inter';ctx.fillStyle='#94a3b8';ctx.fillText('控制赛车，躲开车辆',W/2,H/2+26);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(15,23,42,.82)';ctx.fillRect(0,H/2-80,W,160);
    ctx.fillStyle='#f87171';ctx.font='bold 30px Inter';ctx.textAlign='center';ctx.fillText('撞车了',W/2,H/2-16);
    ctx.fillStyle='#e2e8f0';ctx.font='16px Inter';ctx.fillText('行驶 '+score+' m · 最高 '+best+' m',W/2,H/2+18);
    ctx.fillStyle='#94a3b8';ctx.font='13px Inter';ctx.fillText('空格 / 点击 再来一次',W/2,H/2+46);
  }
}
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft')keys.left=true;
  if(e.code==='ArrowRight')keys.right=true;
  if(e.code==='Space'){e.preventDefault();start()}
});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.left=false;if(e.code==='ArrowRight')keys.right=false});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();car.x=(e.clientX-r.left)/r.width*W-car.w/2;car.x=Math.max(8,Math.min(W-car.w-8,car.x))});
cv.addEventListener('pointerdown',()=>start());
reset();draw();
</script>
</body>
</html>
