<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星星收集者 — 明园山工作室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1016;--panel:#141e2a;--line:#273648;--text:#e8eef5;--muted:#8ca0b4;--accent:#3ddc97;--amber:#f2b544;--red:#e06c75;--mono:"JetBrains Mono",Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 20px 40px}
a{color:inherit;text-decoration:none}
.top,.wrap{width:min(900px,100%)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.back{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);padding:8px 12px;border-radius:5px;transition:.2s}
.back:hover{color:var(--accent);border-color:var(--accent)}
.title{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted)}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.hud div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;text-align:center}
.hud span{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--muted);display:block}
.hud strong{font-family:var(--mono);font-size:20px;font-weight:700}
.hud .s strong{color:var(--amber)}.hud .l strong{color:var(--red)}
.stage{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0d141d;box-shadow:0 24px 60px rgba(0,0,0,.4)}
canvas{display:block;width:100%;height:auto;touch-action:none}
.overlay{position:absolute;inset:0;background:rgba(8,13,19,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;backdrop-filter:blur(3px)}
.overlay.hidden{display:none}
.overlay .tag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--amber)}
.overlay h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.04em}
.overlay p{color:var(--muted);font-size:14px;max-width:420px}
.btn{font-family:var(--mono);font-size:13px;font-weight:700;background:var(--amber);color:#1a1204;border:0;border-radius:5px;padding:13px 28px;cursor:pointer;transition:filter .2s,transform .2s}
.btn:hover{filter:brightness(1.12);transform:translateY(-2px)}
.help{margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:2;text-align:center}
.help b{color:var(--amber)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--text);background:var(--panel)}
</style>
</head>
<body>
<div class="top"><a class="back" href="mini-games.html">← 返回小游戏列表</a><span class="title">GAME / 003 — STAR COLLECTOR</span></div>
<div class="wrap">
  <div class="hud">
    <div class="s"><span>SCORE</span><strong id="score">0</strong></div>
    <div class="l"><span>LIVES</span><strong id="lives">3</strong></div>
    <div><span>BEST</span><strong id="best">0</strong></div>
  </div>
  <div class="stage">
    <canvas id="game" width="900" height="480"></canvas>
    <div class="overlay" id="overlay">
      <div class="tag">READY / 003</div>
      <h1 id="ovTitle">星星收集者</h1>
      <p id="ovText">接住掉落的星星，避开灰色落石。接一块石头损失一条命，三条命用完游戏结束。</p>
      <button class="btn" id="startBtn">开始游戏 [ ENTER ]</button>
    </div>
  </div>
  <div class="help"><b>操作：</b>移动鼠标 / 手指 或 <kbd>←</kbd> <kbd>→</kbd> 控制篮子　·　<kbd>ENTER</kbd> 开始或重来</div>
</div>
<script>
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d'),W=cvs.width,H=cvs.height;
const overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovText=document.getElementById('ovText'),startBtn=document.getElementById('startBtn');
const elScore=document.getElementById('score'),elLives=document.getElementById('lives'),elBest=document.getElementById('best');
function getBest(k){try{return +(localStorage.getItem(k)||0)||0}catch(e){return 0}}
function setBest(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const BY=420,BW=96,BH=12;
let state='ready',items=[],score=0,lives=3,frame=0,flash=0,basketX=W/2-BW/2,mouseActive=false;
let best=getBest('mys_star_best');elBest.textContent=best;
const keys={left:false,right:false};
function reset(){items=[];score=0;lives=3;frame=0;flash=0;basketX=W/2-BW/2;state='playing';overlay.classList.add('hidden');hud()}
function spawn(){
  const rock=Math.random()<.24;
  items.push({x:45+Math.random()*(W-90),y:-26,vy:2.1+Math.random()*1.5+Math.min(score/450,2.4),rock,rot:Math.random()*6.28});
}
function over(){
  state='over';
  if(score>best){best=score;setBest('mys_star_best',Math.floor(best))}
  ovTitle.textContent='游戏结束';
  ovText.textContent='得分 '+score+' · 接住 '+Math.floor(score/10)+' 颗星 · 历史最佳 '+Math.floor(best);
  startBtn.textContent='再来一次 [ ENTER ]';overlay.classList.remove('hidden');hud();
}
function update(){
  frame++;
  const gap=Math.max(17,48-Math.floor(score/100)*4);
  if(frame%gap===0)spawn();
  if(!mouseActive){if(keys.left)basketX-=9;if(keys.right)basketX+=9}
  basketX=Math.max(0,Math.min(W-BW,basketX));
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.y+=it.vy;it.rot+=.045;
    if(it.y+13>=BY&&it.y-13<=BY+BH&&it.x>basketX+2&&it.x<basketX+BW-2){
      if(it.rock){lives--;flash=14;if(lives<=0){items.splice(i,1);over();return}}
      else score+=10;
      items.splice(i,1);continue;
    }
    if(it.y>H+32)items.splice(i,1);
  }
  if(flash>0)flash--;
  hud();
}
function hud(){elScore.textContent=score;elLives.textContent='♥'.repeat(Math.max(0,lives))+'·'.repeat(Math.max(0,3-lives));elBest.textContent=Math.max(best,score)}
function star(x,y,r,rot){
  ctx.beginPath();
  for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rr=i%2===0?r:r*.44;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
  ctx.closePath();ctx.fillStyle='#f2b544';ctx.fill();
  ctx.beginPath();ctx.arc(x,y,r*.22,0,6.284);ctx.fillStyle='#fff3d0';ctx.fill();
}
function rock(x,y,r,rot){
  const pts=[[-.9,-.3],[-.4,-.9],[.4,-.8],[.95,-.15],[.7,.65],[-.1,.95],[-.85,.55]];
  ctx.beginPath();
  pts.forEach((p,i)=>{const px=x+(p[0]*Math.cos(rot)-p[1]*Math.sin(rot))*r,py=y+(p[0]*Math.sin(rot)+p[1]*Math.cos(rot))*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});
  ctx.closePath();ctx.fillStyle='#6b7b8c';ctx.fill();ctx.strokeStyle='#8ca0b4';ctx.lineWidth=1.5;ctx.stroke();
}
function draw(){
  ctx.fillStyle='#0d141d';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(39,54,72,.5)';
  for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  ctx.fillStyle='rgba(140,160,180,.3)';
  for(let i=0;i<34;i++)ctx.fillRect((i*173)%W,20+(i*97)%300,2,2);
  ctx.fillStyle='#2a3a4d';ctx.fillRect(0,H-12,W,12);
  ctx.fillStyle='#3ddc97';ctx.fillRect(basketX,BY,BW,BH);
  ctx.fillStyle='rgba(61,220,151,.25)';ctx.fillRect(basketX-3,BY-4,BW+6,4);
  for(const it of items)it.rock?rock(it.x,it.y,13,it.rot):star(it.x,it.y,13,it.rot);
  ctx.font='600 12px "JetBrains Mono",monospace';ctx.fillStyle='rgba(232,238,245,.55)';
  ctx.fillText('SCORE '+score,18,28);
  if(flash>0){ctx.fillStyle='rgba(224,108,117,'+(flash/28)+')';ctx.fillRect(0,0,W,H)}
}
function loop(){if(state==='playing')update();draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{
  mouseActive=false;
  if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.left=true;e.preventDefault()}
  if(e.code==='ArrowRight'||e.code==='KeyD'){keys.right=true;e.preventDefault()}
  if(e.code==='Enter'){e.preventDefault();reset()}
});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false});
cvs.addEventListener('pointermove',e=>{mouseActive=true;const r=cvs.getBoundingClientRect();basketX=(e.clientX-r.left)/r.width*W-BW/2});
startBtn.addEventListener('click',reset);
loop();
</script>
</body>
</html>
