<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明园山寻宝 — 明园山工作室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1016;--panel:#141e2a;--line:#273648;--text:#e8eef5;--muted:#8ca0b4;--accent:#3ddc97;--amber:#f2b544;--red:#e06c75;--mono:"JetBrains Mono",Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 20px 40px}
a{color:inherit;text-decoration:none}
.top,.wrap{width:min(620px,100%)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.back{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);padding:8px 12px;border-radius:5px;transition:.2s}
.back:hover{color:var(--accent);border-color:var(--accent)}
.title{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted)}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.hud div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;text-align:center}
.hud span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--muted);display:block}
.hud strong{font-family:var(--mono);font-size:20px;font-weight:700}
.hud .s strong{color:var(--accent)}.hud .t strong{color:var(--amber)}
.stage{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;aspect-ratio:1/1}
.cell{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:4px;cursor:pointer;transition:background .12s,border-color .12s}
.cell:hover{border-color:#4a6075;background:#101822}
.cell.target{border-color:var(--accent);background:rgba(61,220,151,.09)}
.cell.target::after{content:"";position:absolute;left:50%;top:50%;width:38%;height:38%;background:var(--accent);transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 22px rgba(61,220,151,.75)}
.cell.hit{background:rgba(61,220,151,.35);animation:pop .25s ease-out}
.cell.miss{background:rgba(224,108,117,.25);animation:shake .25s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
.overlay{position:absolute;inset:0;background:rgba(8,13,19,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;backdrop-filter:blur(3px);border-radius:8px;padding:20px}
.overlay.hidden{display:none}
.overlay .tag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--accent)}
.overlay h1{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.04em}
.overlay p{color:var(--muted);font-size:14px;max-width:400px}
.btn{font-family:var(--mono);font-size:13px;font-weight:700;background:var(--accent);color:#07130d;border:0;border-radius:5px;padding:13px 28px;cursor:pointer;transition:filter .2s,transform .2s}
.btn:hover{filter:brightness(1.12);transform:translateY(-2px)}
.help{margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:2;text-align:center}
.help b{color:var(--amber)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 7px;color:var(--text);background:var(--panel)}
</style>
</head>
<body>
<div class="top"><a class="back" href="mini-games.html">← 返回小游戏列表</a><span class="title">GAME / 002 — TREASURE HUNT</span></div>
<div class="wrap">
  <div class="hud">
    <div class="s"><span>SCORE</span><strong id="score">0</strong></div>
    <div><span>COMBO</span><strong id="combo">0</strong></div>
    <div class="t"><span>TIME</span><strong id="time">30.0</strong></div>
    <div><span>BEST</span><strong id="best">0</strong></div>
  </div>
  <div class="stage">
    <div id="grid"></div>
    <div class="overlay" id="overlay">
      <div class="tag">READY / 002</div>
      <h1 id="ovTitle">明园山寻宝</h1>
      <p id="ovText">目标会在网格中随机出现并很快消失。点中得分，连击越高加成越多；点错扣 4 分。</p>
      <button class="btn" id="startBtn">开始游戏 [ ENTER ]</button>
    </div>
  </div>
  <div class="help"><b>操作：</b>鼠标 / 触摸点击目标　·　<kbd>ENTER</kbd> 开始或重来　·　限时 <b>30 秒</b></div>
</div>
<script>
const N=36,grid=document.getElementById('grid');
const overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),ovText=document.getElementById('ovText'),startBtn=document.getElementById('startBtn');
const elScore=document.getElementById('score'),elCombo=document.getElementById('combo'),elTime=document.getElementById('time'),elBest=document.getElementById('best');
function getBest(k){try{return +(localStorage.getItem(k)||0)||0}catch(e){return 0}}
function setBest(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let cells=[],target=-1,score=0,combo=0,maxCombo=0,time=30,state='ready',targetTimer=null,tickTimer=null;
let best=getBest('mys_hunt_best');elBest.textContent=best;
for(let i=0;i<N;i++){const d=document.createElement('div');d.className='cell';d.addEventListener('pointerdown',()=>hit(i));grid.appendChild(d);cells.push(d)}
function hud(){elScore.textContent=Math.floor(score);elCombo.textContent=combo+'x';elTime.textContent=time.toFixed(1);elBest.textContent=Math.max(best,Math.floor(score))}
function placeTarget(){
  clearTimeout(targetTimer);
  if(target>=0)cells[target].classList.remove('target');
  let n;do{n=Math.floor(Math.random()*N)}while(n===target&&N>1);
  target=n;cells[n].classList.add('target');
  const dwell=Math.max(430,1150-score*2.6);
  targetTimer=setTimeout(()=>{
    if(target>=0){cells[target].classList.remove('target');target=-1;combo=0;hud()}
    placeTarget();
  },dwell);
}
function start(){
  clearInterval(tickTimer);clearTimeout(targetTimer);
  score=0;combo=0;maxCombo=0;time=30;target=-1;state='playing';
  cells.forEach(c=>c.classList.remove('target','hit','miss'));
  overlay.classList.add('hidden');hud();placeTarget();
  tickTimer=setInterval(()=>{time=Math.max(0,time-.1);hud();if(time<=0)finish()},100);
}
function finish(){
  state='over';clearInterval(tickTimer);clearTimeout(targetTimer);
  if(target>=0){cells[target].classList.remove('target');target=-1}
  const final=Math.floor(score);
  if(final>best){best=final;setBest('mys_hunt_best',best)}
  ovTitle.textContent='时间到';
  ovText.textContent='得分 '+final+' · 最高连击 '+maxCombo+'x · 历史最佳 '+best;
  startBtn.textContent='再来一次 [ ENTER ]';overlay.classList.remove('hidden');hud();
}
function hit(i){
  if(state!=='playing')return;
  if(i===target){
    clearTimeout(targetTimer);
    combo++;maxCombo=Math.max(maxCombo,combo);
    score+=10+Math.min(combo,10)*2;
    cells[i].classList.remove('target');cells[i].classList.add('hit');
    setTimeout(()=>cells[i].classList.remove('hit'),260);
    target=-1;hud();placeTarget();
  }else{
    combo=0;score=Math.max(0,score-4);
    cells[i].classList.add('miss');setTimeout(()=>cells[i].classList.remove('miss'),260);hud();
  }
}
addEventListener('keydown',e=>{if(e.code==='Enter'){e.preventDefault();start()}});
startBtn.addEventListener('click',start);
</script>
</body>
</html>
